name: Bug report
description: Report a problem with EnvShape CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal env/example pair if possible.
      placeholder: |
        1. Create .env with ...
        2. Run envshape check ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EnvShape version
      placeholder: "0.1.0"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
